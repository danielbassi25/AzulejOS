kind = "web"
previewPath = "/"
title = "OikOS"
version = "1.0.0"
id = "artifacts/oikos"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24786

[services.development]
run = "pnpm --filter @workspace/oikos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oikos", "run", "build" ]
publicDir = "artifacts/oikos/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24786"
BASE_PATH = "/"
